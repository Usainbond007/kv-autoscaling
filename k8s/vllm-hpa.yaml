apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      enableServiceLinks: false
      runtimeClassName: nvidia
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.32.0
          args:
            - --model
            - Qwen/Qwen2.5-0.5B-Instruct
            - --gpu-memory-utilization
            - "0.38"
            - --kv-cache-memory-bytes
            - "134217728"
            - --max-model-len
            - "1024"
            - --enforce-eager
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          ports:
            - containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu.shared: 1
            requests:
              cpu: 100m
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "8000"
  name: vllm
spec:
  selector:
    app: vllm
  ports:
    - port: 8000
      targetPort: 8000
