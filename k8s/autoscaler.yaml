apiVersion: v1
kind: ServiceAccount
metadata:
  name: kv-autoscaler
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kv-autoscaler
rules:
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    resourceNames: ["vllm"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kv-autoscaler
subjects:
  - kind: ServiceAccount
    name: kv-autoscaler
    namespace: default
roleRef:
  kind: Role
  name: kv-autoscaler
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kv-autoscaler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kv-autoscaler
  template:
    metadata:
      labels:
        app: kv-autoscaler
    spec:
      serviceAccountName: kv-autoscaler
      containers:
        - name: controller
          image: python:3.12-slim
          command: ["python", "-u", "/app/controller.py"]
          env:
            - name: DRY_RUN
              value: "false"
            - name: UP_QUEUE_P95_SECONDS
              value: "1.0"
            - name: UP_KV
              value: "0.30"
            - name: UP_WAITING
              value: "1"
            - name: UP_RUNNING
              value: "6"
            - name: UP_CONSECUTIVE_SAMPLES
              value: "2"
            - name: QUERY_WINDOW_SECONDS
              value: "30"
            - name: DOWN_QUEUE_P95_SECONDS
              value: "0.20"
            - name: DOWN_KV
              value: "0.15"
            - name: DOWN_RUNNING
              value: "1"
            - name: DOWN_SECONDS
              value: "120"
            - name: CHECK_SECONDS
              value: "5"
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
      volumes:
        - name: code
          configMap:
            name: kv-autoscaler-code
